[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nem-battery-lab"
version = "0.1.0"
description = "Walk-forward electricity price forecasting, battery dispatch optimisation and risk analysis on public AEMO data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Fronzi" }]
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.110",
  "joblib>=1.3",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.20",
  "pyarrow>=15",
  "pydantic>=2.6",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "typer>=0.12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "hypothesis>=3.0", "mypy>=1.9", "pandas-stubs", "pytest>=8", "pytest-cov>=5", "ruff>=0.4", "types-requests"]

[project.scripts]
nem-lab = "nembattery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nembattery"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "nembattery/sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=nembattery --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD", "RUF"]
ignore = ["PD011", "PD010"]  # strict DataFrame.pivot is wanted: duplicates must fail

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
